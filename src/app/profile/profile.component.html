<p-toast />

<p *ngIf="!user && !error" role="status">Carregando perfil…</p>
<div *ngIf="error" role="alert">
  <p>{{ error }}</p>
  <p-button label="Tentar novamente" (onClick)="loadUserProfile()" />
</div>

<div class="profile-container" *ngIf="user">
  <p-card class="profile-card">
    <div class="profile-header">
      <app-avatar [userName]="user.name" />
      <h1>{{ user.name }}</h1>
    </div>
    <p-fieldset legend="Informações do perfil">
      <dl>
        <dt>E-mail</dt><dd>{{ user.email }}</dd>
        <dt>Usuário</dt><dd>{{ user.login }}</dd>
        <dt>Data de entrada</dt><dd>{{ user.joinDate | date:'dd/MM/yyyy' }}</dd>
      </dl>
      <p-button label="Alterar senha" (onClick)="displayResetPasswordDialog = true" />
    </p-fieldset>
  </p-card>
</div>

<p-dialog header="Alterar senha" [(visible)]="displayResetPasswordDialog" [modal]="true"
          [style]="{ width: 'min(27rem, 94vw)' }" [draggable]="false" [resizable]="false"
          [closable]="!saving" [closeOnEscape]="!saving" (onHide)="hideResetPasswordDialog()">
  <form class="reset-password-form" (ngSubmit)="resetPassword()">
    <div class="p-field">
      <label for="oldPassword">Senha atual</label>
      <input id="oldPassword" name="oldPassword" type="password" autocomplete="current-password"
             [(ngModel)]="oldPassword" pInputText class="full-width" required />
    </div>
    <div class="p-field">
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password"
             [(ngModel)]="newPassword" pInputText class="full-width" minlength="8" required />
    </div>
    <p-button type="submit" label="Salvar" [loading]="saving" [disabled]="!oldPassword || newPassword.length < 8" />
  </form>
</p-dialog>
