<button type="button" (click)="toggleTheme()" class="theme-toggle-btn p-button-rounded p-button-text"
        [attr.aria-label]="isDarkMode ? 'Ativar tema claro' : 'Ativar tema escuro'">
  <i class="pi" [ngClass]="isDarkMode ? 'pi-sun' : 'pi-moon'" aria-hidden="true"></i>
</button>

<div class="login-container">
  <p-card class="login-card">
    <div class="logo">
      <h1>WORKTRACK <i class="pi pi-check-circle custom-icon" aria-hidden="true"></i></h1>
    </div>
    <form class="p-fluid" (ngSubmit)="onSubmit()">
      <p-floatLabel>
        <input id="username" name="username" autocomplete="username" pInputText [(ngModel)]="username" required />
        <label for="username">Usuário</label>
      </p-floatLabel>
      <p-floatLabel>
        <p-password inputId="password" name="password" autocomplete="current-password" [(ngModel)]="password"
                    [feedback]="false" [toggleMask]="true" [inputStyle]="{ width: '100%' }" required />
        <label for="password">Senha</label>
      </p-floatLabel>
      <div class="remember-me">
        <p-checkbox inputId="remember-me" name="remember-me" [(ngModel)]="rememberMe" [binary]="true" />
        <label for="remember-me">Lembrar-me</label>
      </div>
      <p-button type="submit" label="Entrar" ariaLabel="Entrar" icon="pi pi-sign-in" [loading]="loading"
                [disabled]="!username.trim() || !password" />
    </form>
    <div class="forgot-password">
      <button pButton type="button" class="p-button-link" label="Esqueceu a senha?"
              (click)="showForgotPasswordDialog = true"></button>
    </div>
  </p-card>
</div>

<p-dialog [(visible)]="showForgotPasswordDialog" header="Recuperação de senha" [modal]="true"
          [draggable]="false" [resizable]="false" [style]="{ width: 'min(28rem, 94vw)' }"
          [closable]="!loading" [closeOnEscape]="!loading" (onHide)="clearRecovery()">
  <form *ngIf="resetPasswordStep === 'request'" class="p-fluid" (ngSubmit)="requestResetCode()" #recoveryForm="ngForm">
    <label for="recovery-email">E-mail cadastrado</label>
    <input id="recovery-email" name="email" type="email" autocomplete="email" [(ngModel)]="email" pInputText required email />
    <p-button type="submit" label="Solicitar código" [loading]="loading" [disabled]="!recoveryForm.valid" />
  </form>
  <form *ngIf="resetPasswordStep === 'reset'" class="p-fluid" (ngSubmit)="resetPassword()" #resetForm="ngForm">
    <label for="recovery-code">Código recebido</label>
    <input id="recovery-code" name="code" autocomplete="one-time-code" [(ngModel)]="code" pInputText required />
    <label for="new-password">Nova senha</label>
    <input id="new-password" name="newPassword" type="password" autocomplete="new-password"
           [(ngModel)]="newPassword" pInputText minlength="8" required />
    <p-button type="submit" label="Redefinir senha" [loading]="loading" [disabled]="!resetForm.valid" />
  </form>
</p-dialog>
<p-toast />
