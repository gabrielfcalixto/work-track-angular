<p-toast />
<p-confirmDialog />
<section class="management">
  <header class="page-header">
    <h1>Usuários</h1>
    <p-button label="Novo usuário" ariaLabel="Novo usuário" icon="pi pi-plus" (onClick)="open()" />
  </header>
  <div *ngIf="error" role="alert"><p>{{ error }}</p><p-button label="Tentar novamente" (onClick)="load()" /></div>
  <p-table #table [value]="users" [loading]="loading" [globalFilterFields]="['name', 'login', 'email']"
           [paginator]="users.length > 10" [rows]="10" dataKey="id" responsiveLayout="scroll" *ngIf="!error">
    <ng-template pTemplate="caption">
      <div class="table-tools">
        <input pInputText #search type="search" placeholder="Buscar usuários" aria-label="Buscar usuários"
               (input)="table.filterGlobal(search.value, 'contains')" />
        <div class="export">
          <p-button label="PDF" [text]="true" [disabled]="!users.length" (onClick)="export('pdf')" />
          <p-button label="Excel" [text]="true" [disabled]="!users.length" (onClick)="export('xlsx')" />
        </div>
      </div>
    </ng-template>
    <ng-template pTemplate="header"><tr><th>Nome</th><th>Login</th><th>E-mail</th><th>Perfil</th><th>Ações</th></tr></ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.name }}</td><td>{{ user.login }}</td><td>{{ user.email }}</td><td>{{ $any(labels)[user.role] }}</td>
        <td class="row-actions">
          <p-button icon="pi pi-pencil" ariaLabel="Editar usuário" [text]="true" (onClick)="open(user)" />
          <p-button icon="pi pi-trash" ariaLabel="Excluir usuário" [text]="true" severity="danger"
                    [disabled]="user.id === currentId" (onClick)="confirmDelete(user)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="5">Nenhum usuário encontrado.</td></tr></ng-template>
  </p-table>
</section>

<p-dialog [(visible)]="dialog" [header]="editingId ? 'Editar usuário' : 'Novo usuário'" [modal]="true"
          [closable]="!saving" [closeOnEscape]="!saving" [draggable]="false" [style]="{ width: 'min(32rem, 94vw)' }">
  <form [formGroup]="form" class="editor-form" (ngSubmit)="save()">
    <label>Nome <input pInputText formControlName="name" maxlength="255" required /></label>
    <label>Login <input pInputText formControlName="login" autocomplete="off" maxlength="255" required /></label>
    <label>E-mail <input pInputText formControlName="email" type="email" maxlength="255" required /></label>
    <label>Perfil de acesso
      <select class="p-inputtext" formControlName="role" aria-label="Perfil de acesso">
        <option *ngFor="let role of roles" [value]="role" [disabled]="editingId === currentId && role !== 'ADMIN'">{{ labels[role] }}</option>
      </select>
    </label>
    <label *ngIf="!editingId">Senha inicial
      <input pInputText formControlName="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" />
      <span class="detail">Use pelo menos 8 caracteres. Deixe em branco para envio por e-mail, se disponível.</span>
    </label>
    <p class="form-error" *ngIf="formError" role="alert">{{ formError }}</p>
    <div class="form-actions">
      <p-button type="button" label="Cancelar" [text]="true" [disabled]="saving" (onClick)="dialog = false" />
      <p-button type="submit" label="Salvar" [loading]="saving" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
