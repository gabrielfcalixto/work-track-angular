<p-toast />
<section class="management">
  <header class="page-header">
    <h1>Clientes</h1>
    <p-button label="Novo cliente" ariaLabel="Novo cliente" icon="pi pi-plus" (onClick)="open()" />
  </header>

  <div *ngIf="error" role="alert"><p>{{ error }}</p><p-button label="Tentar novamente" (onClick)="load()" /></div>
  <p-table #table [value]="clients" [loading]="loading" [globalFilterFields]="['name', 'email', 'razaoSocial']"
           [paginator]="clients.length > 10" [rows]="10" dataKey="id" responsiveLayout="scroll" *ngIf="!error">
    <ng-template pTemplate="caption">
      <input pInputText #search type="search" placeholder="Buscar clientes" aria-label="Buscar clientes"
             (input)="table.filterGlobal(search.value, 'contains')" />
    </ng-template>
    <ng-template pTemplate="header">
      <tr><th>Cliente</th><th>E-mail</th><th>Telefone</th><th>Ações</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-client>
      <tr>
        <td>{{ client.name }}<div *ngIf="client.razaoSocial" class="detail">{{ client.razaoSocial }}</div></td>
        <td>{{ client.email }}</td><td>{{ client.phone }}</td>
        <td><p-button icon="pi pi-pencil" ariaLabel="Editar cliente" [text]="true" (onClick)="open(client)" /></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="4">Nenhum cliente encontrado.</td></tr></ng-template>
  </p-table>
</section>

<p-dialog [(visible)]="dialog" [header]="editingId ? 'Editar cliente' : 'Novo cliente'" [modal]="true"
          [closable]="!saving" [closeOnEscape]="!saving" [draggable]="false" [style]="{ width: 'min(36rem, 94vw)' }">
  <form [formGroup]="form" class="editor-form" (ngSubmit)="save()">
    <label>Nome <input pInputText formControlName="name" maxlength="255" required /></label>
    <div class="editor-grid">
      <label>E-mail <input pInputText formControlName="email" type="email" required /></label>
      <label>Telefone <input pInputText formControlName="phone" type="tel" maxlength="30" required /></label>
      <label>CPF do contato <input pInputText formControlName="cpf" maxlength="20" required /></label>
      <label>CNPJ <input pInputText formControlName="cnpj" maxlength="30" /></label>
    </div>
    <label>Razão social <input pInputText formControlName="razaoSocial" maxlength="255" /></label>
    <label>Endereço <input pInputText formControlName="address" maxlength="255" /></label>
    <p class="form-error" *ngIf="formError" role="alert">{{ formError }}</p>
    <div class="form-actions">
      <p-button type="button" label="Cancelar" [text]="true" [disabled]="saving" (onClick)="dialog = false" />
      <p-button type="submit" label="Salvar" [loading]="saving" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
