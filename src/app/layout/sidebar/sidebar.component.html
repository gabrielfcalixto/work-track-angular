<p-button icon="pi pi-bars" ariaLabel="Abrir menu" [text]="true" (onClick)="visible = true" />
<p-sidebar [(visible)]="visible" [style]="{ width: 'min(20rem, 88vw)' }">
  <ng-template pTemplate="header">Work Track</ng-template>
  <nav aria-label="Seções do Work Track">
    <a *ngFor="let item of items" [routerLink]="item.link" routerLinkActive="active" ariaCurrentWhenActive="page"
       (click)="visible = false">
      <i class="pi" [ngClass]="item.icon" aria-hidden="true"></i>
      {{ item.label }}
    </a>
  </nav>
</p-sidebar>
