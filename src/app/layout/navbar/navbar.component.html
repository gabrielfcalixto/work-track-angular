<nav class="navbar" aria-label="Barra principal">
  <div class="brand">
    <app-sidebar />
    <a routerLink="/dashboard">Work Track <i class="pi pi-check-circle" aria-hidden="true"></i></a>
  </div>
  <div class="navbar-actions">
    <button pButton type="button" class="p-button-text" (click)="toggleTheme()"
            [attr.aria-label]="isDarkMode ? 'Ativar tema claro' : 'Ativar tema escuro'">
      <i class="pi" [ngClass]="isDarkMode ? 'pi-sun' : 'pi-moon'" aria-hidden="true"></i>
    </button>
    <a routerLink="/profile" aria-label="Meu perfil" class="profile-link"><app-avatar [userName]="user?.name ?? ''" /></a>
    <button pButton type="button" class="p-button-text" (click)="logout()" aria-label="Sair">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
    </button>
  </div>
</nav>
