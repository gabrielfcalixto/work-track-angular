<p-toast />
<p-confirmDialog />
<section class="management">
  <header class="page-header">
    <h1>Projetos</h1>
    <p-button label="Novo projeto" ariaLabel="Novo projeto" icon="pi pi-plus" [disabled]="loading || !!error" (onClick)="open()" />
  </header>
  <div *ngIf="error" role="alert"><p>{{ error }}</p><p-button label="Tentar novamente" (onClick)="load()" /></div>
  <p-table #table [value]="records" [loading]="loading" [globalFilterFields]="['name', 'description']"
           [paginator]="records.length > 10" [rows]="10" dataKey="id" responsiveLayout="scroll" *ngIf="!error">
    <ng-template pTemplate="caption">
      <div class="table-tools">
        <input pInputText #search type="search" placeholder="Buscar projetos" aria-label="Buscar projetos"
               (input)="table.filterGlobal(search.value, 'contains')" />
        <div class="export">
          <p-button label="PDF" [text]="true" [disabled]="!records.length" (onClick)="export('pdf')" />
          <p-button label="Excel" [text]="true" [disabled]="!records.length" (onClick)="export('xlsx')" />
        </div>
      </div>
    </ng-template>
    <ng-template pTemplate="header"><tr><th>Projeto</th><th>Cliente</th><th>Responsável</th><th>Status</th><th>Prazo</th><th>Ações</th></tr></ng-template>
    <ng-template pTemplate="body" let-record>
      <tr>
        <td>{{ record.name }}</td><td>{{ clientName(record.clientId) }}</td><td>{{ userName(record.managerId) }}</td>
        <td>{{ statusLabel(record.status) }}</td><td>{{ record.deadline | date:'dd/MM/yyyy' }}</td>
        <td class="row-actions">
          <p-button icon="pi pi-pencil" ariaLabel="Editar projeto" [text]="true" (onClick)="open(record)" />
          <p-button icon="pi pi-trash" ariaLabel="Excluir projeto" [text]="true" severity="danger"
                    (onClick)="confirmDelete(record)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="6">Nenhum projeto encontrado.</td></tr></ng-template>
  </p-table>
</section>

<p-dialog [(visible)]="dialog" [header]="editingId ? 'Editar projeto' : 'Novo projeto'" [modal]="true"
          [closable]="!saving" [closeOnEscape]="!saving" [draggable]="false" [style]="{ width: 'min(40rem, 94vw)' }">
  <form [formGroup]="form" class="editor-form" (ngSubmit)="save()">
    <label>Nome <input pInputText formControlName="name" maxlength="255" required /></label>
    <label>Descrição <textarea pInputTextarea formControlName="description" rows="3" maxlength="255" required></textarea></label>
    <div class="editor-grid">
      <label>Horas estimadas <input pInputText formControlName="hours" type="number" min="0" step="0.25" required /></label>
      <label>Status <select class="p-inputtext" formControlName="status" aria-label="Status">
        <option *ngFor="let status of statuses" [value]="status">{{ statusLabels[status] }}</option>
      </select></label>
    </div>
    <div class="editor-grid">
      <label>Responsável <select class="p-inputtext" formControlName="managerId" aria-label="Responsável" required>
        <option [ngValue]="null" disabled>Selecione</option>
        <option *ngFor="let manager of managers" [ngValue]="manager.id">{{ manager.name }}</option>
      </select></label>
      <label>Cliente <select class="p-inputtext" formControlName="clientId" aria-label="Cliente" required>
        <option [ngValue]="null" disabled>Selecione</option>
        <option *ngFor="let client of clients" [ngValue]="client.id">{{ client.name }}</option>
      </select></label>
    </div>
    <a routerLink="/clients" *ngIf="!clients.length">Cadastrar primeiro cliente</a>
    <div class="editor-field">
      <label for="project-team">Equipe</label>
      <p-multiSelect inputId="project-team" [options]="users" optionLabel="name" optionValue="id"
                     formControlName="teamMemberIds" placeholder="Selecionar membros" appendTo="body" />
    </div>
    <div class="editor-grid">
      <label>Início <input pInputText formControlName="startDate" type="date" required /></label>
      <label>Prazo <input pInputText formControlName="deadline" type="date" required /></label>
    </div>
    <p class="form-error" *ngIf="formError" role="alert">{{ formError }}</p>
    <div class="form-actions">
      <p-button type="button" label="Cancelar" [text]="true" [disabled]="saving" (onClick)="dialog = false" />
      <p-button type="submit" label="Salvar" [loading]="saving" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
